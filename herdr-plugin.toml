id = "herdr-portal"
name = "HERDR Portal 全局看板"
version = "1.0.4"
min_herdr_version = "0.7.0"
description = "Mission-control dashboard and status board for herdr: monitor every workspace / tab / pane agent in a live TUI kanban or web big-screen, click a card to jump to that session, and reply to a waiting agent from the browser. 聚合全部 workspace / tab / pane 的 Agent 状态看板与网页大屏监控。prefix+a 打开 TUI，prefix+shift+a 打开网页大屏。"
platforms = ["macos", "linux"]

[[actions]]
id = "open-board"
title = "Open global board"
description = "Open the live agent kanban as a Herdr popup."
command = ["bash", "scripts/open-board.sh"]

[[actions]]
id = "open-web"
title = "Open web portal"
description = "Open the web dashboard in a Herdr popup."
command = ["bash", "scripts/open-web.sh"]

[[panes]]
id = "board"
title = "Board"
placement = "overlay"
command = ["python3", "board/tui.py"]
