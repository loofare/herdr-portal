id = "herdr-portal"
name = "HERDR Portal 全局看板"
version = "1.1.0"
min_herdr_version = "0.7.0"
description = "Mission-control dashboard and status board for herdr: monitor every workspace / tab / pane agent in a live TUI kanban (keyboard and mouse friendly) or web big-screen, click a card to jump to that session, and reply to a waiting agent from the browser. Ctrl+B A 打开 TUI 看板，Ctrl+B Shift+A 打开网页大屏；聚合全部 workspace / tab / pane 的 Agent 状态监控，支持鼠标点选。"
platforms = ["macos", "linux"]

[[actions]]
id = "open-board"
title = "Open global board"
description = "Open the live agent kanban as a Herdr popup."
command = ["bash", "scripts/open-board.sh"]

[[actions]]
id = "open-web"
title = "Open web portal"
description = "Open the web dashboard in a Herdr popup."
command = ["bash", "scripts/open-web.sh"]

[[panes]]
id = "board"
title = "Board"
placement = "overlay"
command = ["python3", "board/tui.py"]
